[service]
root = "https://sandbox.api.sap.com/s4hanacloud/sap/opu/odata/sap/API_BUSINESS_PARTNER/"
version = "2"
api_key_env = "SAP_API_KEY"
api_key_header = "APIKey"
timeout_seconds = 30

[pipeline]
recipe = "business_partner"
events_path = "data/sandbox-business-partner-events.jsonl"
checkpoint_path = "state/sandbox-business-partner.json"
max_characters = 1200
overlap_characters = 120

[vector]
path = "data/qdrant-business-partners"
collection = "sap_business_partners"
model = "BAAI/bge-small-en-v1.5"
model_cache_path = "state/embedding-models"
batch_size = 128
