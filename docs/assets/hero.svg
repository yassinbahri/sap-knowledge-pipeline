<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SAP Knowledge Pipeline</title>
  <desc id="desc">OData and HANA records flow through an allow-list into citation-ready knowledge and vector search.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b2b"/>
      <stop offset="1" stop-color="#0a3438"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33d6c5"/>
      <stop offset="1" stop-color="#62a8ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1050" cy="42" r="190" fill="#0d5a5b" opacity=".25"/>
  <circle cx="110" cy="400" r="180" fill="#123b71" opacity=".22"/>
  <g fill="none" stroke="url(#accent)" stroke-width="3" opacity=".75">
    <path d="M272 246 H412"/><path d="M584 246 H724"/><path d="M896 246 H1010"/>
  </g>
  <g fill="#071b2b" stroke="#35d2c1" stroke-width="2">
    <rect x="70" y="190" width="202" height="112" rx="18"/>
    <rect x="412" y="190" width="172" height="112" rx="18"/>
    <rect x="724" y="190" width="172" height="112" rx="18"/>
    <rect x="1010" y="190" width="120" height="112" rx="18"/>
  </g>
  <g fill="#eafffc" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="171" y="228" font-size="18" font-weight="700">SAP SOURCES</text>
    <text x="171" y="260" font-size="16" fill="#8edfd7">OData V2/V4 · HANA</text>
    <text x="498" y="228" font-size="18" font-weight="700">ALLOW-LIST</text>
    <text x="498" y="260" font-size="16" fill="#8edfd7">Explicit recipes</text>
    <text x="810" y="228" font-size="18" font-weight="700">KNOWLEDGE</text>
    <text x="810" y="260" font-size="16" fill="#8edfd7">Chunks · Citations</text>
    <text x="1070" y="228" font-size="18" font-weight="700">RAG</text>
    <text x="1070" y="260" font-size="16" fill="#8edfd7">Retrieve</text>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="70" y="86" fill="#ffffff" font-size="42" font-weight="750">SAP Knowledge Pipeline</text>
    <text x="70" y="126" fill="#9bdad8" font-size="20">Business records in. Citation-ready knowledge out.</text>
  </g>
  <g fill="#33d6c5" filter="url(#glow)">
    <circle cx="342" cy="246" r="5"/><circle cx="654" cy="246" r="5"/><circle cx="953" cy="246" r="5"/>
  </g>
  <text x="70" y="360" fill="#a8c4ce" font-family="Segoe UI,Arial,sans-serif" font-size="15">Provider-neutral · Typed · Least-privilege by design · No automatic LLM calls</text>
</svg>
