[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sap-knowledge-pipeline"
version = "0.1.0a2"
description = "Turn SAP OData and HANA records into secure, citation-ready knowledge for RAG."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Yassin Bahri" },
]
keywords = ["sap", "hana", "odata", "rag", "retrieval", "data-pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<1",
  "lxml>=5,<7",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
hana = ["hdbcli>=2.24,<3"]
qdrant = ["qdrant-client>=1.18,<2"]
fastembed = ["fastembed>=0.8,<0.9", "qdrant-client>=1.18,<2"]
all = [
  "fastembed>=0.8,<0.9",
  "hdbcli>=2.24,<3",
  "qdrant-client>=1.18,<2",
]

[project.urls]
Homepage = "https://github.com/yassinbahri/sap-knowledge-pipeline"
Documentation = "https://github.com/yassinbahri/sap-knowledge-pipeline#readme"
Changelog = "https://github.com/yassinbahri/sap-knowledge-pipeline/blob/main/CHANGELOG.md"
Issues = "https://github.com/yassinbahri/sap-knowledge-pipeline/issues"
Source = "https://github.com/yassinbahri/sap-knowledge-pipeline"

[project.scripts]
sap-knowledge = "sap_knowledge.cli:main"

[dependency-groups]
dev = [
  "lxml-stubs>=0.5",
  "mypy>=1.17",
  "pytest>=8.4",
  "qdrant-client>=1.18,<2",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sap_knowledge"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sap_knowledge"]

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastembed.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "qdrant_client.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "hdbcli.*"
ignore_missing_imports = true
