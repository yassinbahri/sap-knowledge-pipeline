[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sap-knowledge-pipeline"
version = "0.1.0a1"
description = "Turn SAP OData business objects into secure, citation-ready knowledge for RAG."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Yassin Bahri" },
]
keywords = ["sap", "odata", "rag", "retrieval", "data-pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<1",
  "lxml>=5,<7",
  "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
  "lxml-stubs>=0.5",
  "mypy>=1.17",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sap_knowledge"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sap_knowledge"]

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true
