name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Never include SAP credentials, private hostnames, continuation URLs, or customer data.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0a1
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source
      options:
        - OData V2
        - OData V4
        - SAP HANA
        - Knowledge transformation
        - Vector indexing or retrieval
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic data and remove all secrets and private identifiers.
      render: python
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python, operating system, Django if relevant, and SAP interface versions.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, tokens, private URLs, customer data, and production records.
          required: true
